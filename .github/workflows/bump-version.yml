name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version on default branch
    environment: release
    permissions:
      contents: read # PAT_TOKEN performs the default-branch commit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run this workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Require repository token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "Repository secret PAT_TOKEN is required for the version commit." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update package versions
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          version=$(node --print "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "$(node --print "require('./package-lock.json').version")" = "$version"

      - name: Create signed GitHub commit
        id: commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const branch = context.payload.repository.default_branch;
            const additions = ["package.json", "package-lock.json"].map((path) => ({
              path,
              contents: fs.readFileSync(path).toString("base64"),
            }));

            const result = await github.graphql(
              `mutation CreateVersionCommit($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: `${owner}/${repo}`,
                    branchName: branch,
                  },
                  expectedHeadOid: context.sha,
                  message: {
                    headline: `chore(release): bump version to ${version}`,
                  },
                  fileChanges: { additions },
                },
              },
            );
            const commit = result.createCommitOnBranch.commit;

            core.setOutput("oid", commit.oid);
            core.setOutput("url", commit.url);
            await core.summary
              .addHeading(`Version ${version}`)
              .addLink(`Commit ${commit.oid.slice(0, 12)}`, commit.url)
              .addRaw("\nThe PAT-authenticated push starts CI on the default branch.")
              .write();
