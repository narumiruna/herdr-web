name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Open version bump pull request
    environment: release
    permissions:
      actions: write # Dispatch CI for the bot-created pull request.
      contents: write # Create the version branch and commit.
      pull-requests: write # Open the version bump pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run this workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update package versions
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          version=$(node --print "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=github-actions/chore/bump-v$version" >> "$GITHUB_OUTPUT"
          test "$(node --print "require('./package-lock.json').version")" = "$version"

      - name: Create signed GitHub commit and pull request
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const version = process.env.VERSION;
            const base = context.payload.repository.default_branch;

            let branchCreated = false;
            let result;
            let pull;
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: context.sha,
              });
              branchCreated = true;

              const additions = ["package.json", "package-lock.json"].map((path) => ({
                path,
                contents: fs.readFileSync(path).toString("base64"),
              }));
              result = await github.graphql(
                `mutation CreateVersionCommit($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) {
                    commit { oid url }
                  }
                }`,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner: `${owner}/${repo}`,
                      branchName: branch,
                    },
                    expectedHeadOid: context.sha,
                    message: {
                      headline: `chore(release): bump version to ${version}`,
                    },
                    fileChanges: { additions },
                  },
                },
              );

              pull = await github.rest.pulls.create({
                owner,
                repo,
                base,
                head: branch,
                title: `chore(release): bump version to ${version}`,
                body: [
                  `Bump Hedr from the current version to \`${version}\`.`,
                  "",
                  "After this pull request passes CI and is merged, create and push the signed tag " +
                    `\`v${version}\` to start the release workflow.`,
                ].join("\n"),
              });

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "ci.yml",
                ref: branch,
              });
            } catch (error) {
              if (pull) {
                try {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pull.data.number,
                    state: "closed",
                  });
                } catch (cleanupError) {
                  core.warning(`Could not close pull request: ${cleanupError.message}`);
                }
              }
              if (branchCreated) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${branch}`,
                  });
                } catch (cleanupError) {
                  core.warning(`Could not delete ${branch}: ${cleanupError.message}`);
                }
              }
              throw error;
            }

            core.setOutput("url", pull.data.html_url);
            await core.summary
              .addHeading(`Version ${version}`)
              .addLink(`Pull request #${pull.data.number}`, pull.data.html_url)
              .addRaw(`\nCommit: ${result.createCommitOnBranch.commit.oid}`)
              .write();
