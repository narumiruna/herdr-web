name: Publish

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    environment: release
    permissions:
      contents: read
      id-token: write # Authenticate to npm through Trusted Publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Validate release tag and package versions
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publish must run from a vX.Y.Z tag, not $GITHUB_REF." >&2
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Publish tags must use stable semver: v1.2.3." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_REF_NAME is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi

          version=${GITHUB_REF_NAME#v}
          package_version=$(node --print "require('./package.json').version")
          lock_version=$(node --print "require('./package-lock.json').version")
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json and package-lock.json." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository checks
        run: npm run ci

      - name: Run browser tests
        run: npm run test:e2e

      - name: Inspect npm package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Check existing npm package
        id: npm-package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if npm view "herdr-web@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.npm-package.outputs.exists != 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --ignore-scripts

      - name: Summarize publication
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          {
            echo "## Published herdr-web $VERSION"
            echo
            echo "npm: \`herdr-web@$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
