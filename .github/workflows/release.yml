name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag signature
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const tagName = context.ref.replace("refs/tags/", "");
            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            });
            if (ref.data.object.type !== "tag") {
              throw new Error(`${tagName} must be an annotated, signed tag`);
            }

            const tag = await github.rest.git.getTag({
              owner,
              repo,
              tag_sha: ref.data.object.sha,
            });
            if (tag.data.object.type !== "commit" || tag.data.object.sha !== context.sha) {
              throw new Error(`${tagName} does not directly reference ${context.sha}`);
            }
            if (!tag.data.verification?.verified) {
              const reason = tag.data.verification?.reason ?? "unknown";
              throw new Error(`${tagName} signature is not verified: ${reason}`);
            }
            core.info(`${tagName} has a verified ${tag.data.verification.reason} signature`);

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate tag and package versions
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_REF_NAME is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use stable semver: v1.2.3." >&2
            exit 1
          fi
          package_version=$(node --print "require('./package.json').version")
          lock_version=$(node --print "require('./package-lock.json').version")
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json and package-lock.json." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository checks
        run: npm run ci

      - name: Run browser tests
        run: npm run test:e2e

  publish:
    name: Publish npm package and GHCR image
    needs: validate
    permissions:
      contents: read
      packages: write # Allow the reusable workflow to publish GHCR.
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  release:
    name: Create GitHub release
    environment: release
    needs:
      - validate
      - publish
    permissions:
      contents: write # Create the GitHub Release with GITHUB_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          image=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          notes=$(printf 'npm package: `herdr-web@%s`\n\nContainer image: `%s@%s`' "$VERSION" "$image" "$DIGEST")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hedr $VERSION" \
            --generate-notes \
            --notes "$notes"
