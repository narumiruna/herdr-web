name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate tag and package versions
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_REF_NAME is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use stable semver: v1.2.3." >&2
            exit 1
          fi
          package_version=$(node --print "require('./package.json').version")
          lock_version=$(node --print "require('./package-lock.json').version")
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json and package-lock.json." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository checks
        run: npm run ci

      - name: Run browser tests
        run: npm run test:e2e

  publish:
    name: Publish npm package and GHCR image
    needs: validate
    permissions:
      contents: read
      packages: write # Allow the reusable workflow to publish GHCR.
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  release:
    name: Create GitHub release
    environment: release
    needs:
      - validate
      - publish
    permissions:
      contents: write # Create the GitHub Release with GITHUB_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          image=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          notes=$(printf 'npm package: `herdr-web@%s`\n\nContainer image: `%s@%s`' "$VERSION" "$image" "$DIGEST")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hedr $VERSION" \
            --generate-notes \
            --notes "$notes"
