name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    environment: release
    permissions:
      contents: write # Create the GitHub Release with GITHUB_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate release tag and package versions
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release must run from a vX.Y.Z tag, not $GITHUB_REF." >&2
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use stable semver: v1.2.3." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_REF_NAME is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi

          version=${GITHUB_REF_NAME#v}
          package_version=$(node --print "require('./package.json').version")
          lock_version=$(node --print "require('./package-lock.json').version")
          if [ "$version" != "$package_version" ] || [ "$version" != "$lock_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json and package-lock.json." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping creation."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hedr $VERSION" \
            --generate-notes
