name: HerdrWeb
options:
  bundleIdPrefix: dev.narumiruna
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  HerdrWeb:
    type: application
    platform: iOS
    sources:
      - path: HerdrWeb
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumiruna.herdrweb.ios
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: HerdrWeb/Resources/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'NO'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HerdrWebUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HerdrWebUITests
    dependencies:
      - target: HerdrWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumiruna.herdrweb.ios.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
  HerdrWebTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HerdrWebTests
    dependencies:
      - target: HerdrWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumiruna.herdrweb.ios.tests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  HerdrWeb:
    shared: true
    build:
      targets:
        HerdrWeb: all
        HerdrWebTests: [test]
    test:
      targets:
        - HerdrWebTests
        - HerdrWebUITests
