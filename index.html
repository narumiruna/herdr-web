<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#11110f" />
    <script>
      try {
        const key = "herdr-web-appearance";
        const legacyKey = ["he", "dr-appearance"].join("");
        const saved = localStorage.getItem(key) ?? localStorage.getItem(legacyKey);
        if (localStorage.getItem(key) === null && saved !== null) {
          localStorage.setItem(key, saved);
          localStorage.removeItem(legacyKey);
        }
        const appearance = saved === "light" ? "light" : "dark";
        document.documentElement.classList.add(appearance);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", appearance === "dark" ? "#11110f" : "#f6f3ed");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta
      name="description"
      content="herdr-web is a browser workbench for herdr coding-agent sessions."
    />
    <title>herdr-web — agent workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
